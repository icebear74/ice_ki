# ---------------------------------------------------------------------------
# Character extraction service - CPU only.
#
# It receives raw story text over HTTP, asks the internal Oobabooga
# OpenAI-compatible API for a structured extraction, validates the answer and
# writes
#   * a SillyTavern V2 character card into the shared character PVC
#   * a structured person profile (+ generated visual prompt) into the
#     extractor PVC
#
# The image is built locally, see textgenerator/extractor/Dockerfile:
#   docker build -t ice-ki/character-extractor:0.1.0 textgenerator/extractor
#   docker save ice-ki/character-extractor:0.1.0 | sudo k3s ctr images import -
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: character-extractor
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: character-extractor
    app.kubernetes.io/part-of: textgenerator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: character-extractor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: character-extractor
        app.kubernetes.io/part-of: textgenerator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Longhorn hands out a brand new, empty filesystem owned by root:root.
        # fsGroup fixes the ReadWriteOnce extractor volume (Longhorn's CSI
        # driver uses fsGroupPolicy: ReadWriteOnceWithFSType), but it is NOT
        # applied to the ReadWriteMany shared volume - so chown that one
        # explicitly. Running the main container as a non-root user with a
        # read-only root filesystem stays unchanged.
        - name: fix-volume-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown 1000:1000 /data/characters /data/extractor
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: shared-characters
              mountPath: /data/characters
            - name: extractor-data
              mountPath: /data/extractor
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: character-extractor
          image: ice-ki/character-extractor:0.1.0
          # This image is built on the host and imported into the K3s image
          # store - it does not exist in any registry. "Never" prevents
          # containerd from trying to pull it from Docker Hub (which fails
          # with ErrImagePull). Build it first:
          #   textgenerator/scripts/build-extractor-image.sh
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OOBABOOGA_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: textgen-config
                  key: OOBABOOGA_API_BASE_URL
            - name: TEXTGEN_CONTEXT_SIZE
              valueFrom:
                configMapKeyRef:
                  name: textgen-config
                  key: TEXTGEN_CONTEXT_SIZE
            # Model name passed to the API. Empty = use the model that is
            # currently loaded in text-generation-webui.
            - name: EXTRACTOR_MODEL
              value: ""
            - name: EXTRACTOR_MAX_TOKENS
              value: "2048"
            - name: EXTRACTOR_REQUEST_TIMEOUT
              value: "600"
            - name: CHARACTER_CARD_DIR
              value: /data/characters
            - name: PROFILE_DIR
              value: /data/extractor/profiles
            - name: RAW_OUTPUT_DIR
              value: /data/extractor/raw
            # Existing cards/profiles are never replaced unless a request
            # explicitly asks for it AND this is set to "true".
            - name: EXTRACTOR_ALLOW_OVERWRITE
              value: "false"
            # Content policy switch for the GENERATED IMAGE PROMPTS only.
            #   off     - no additional wording is added (default, uncensored)
            #   sfw     - appends a safe-for-work wording to image prompts
            # Text extraction itself never injects moderation instructions.
            - name: IMAGE_PROMPT_SAFETY_MODE
              value: "off"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: shared-characters
              mountPath: /data/characters
            - name: extractor-data
              mountPath: /data/extractor
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: shared-characters
          persistentVolumeClaim:
            claimName: shared-characters-pvc
        - name: extractor-data
          persistentVolumeClaim:
            claimName: extractor-data-pvc
        - name: tmp
          emptyDir: {}
---
# API service - deliberately ClusterIP only (no NodePort). Reach it from the
# host with:
#   kubectl -n ai-stack port-forward svc/character-extractor 8080:8080
apiVersion: v1
kind: Service
metadata:
  name: character-extractor
  namespace: ai-stack
  labels:
    app.kubernetes.io/name: character-extractor
    app.kubernetes.io/part-of: textgenerator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: character-extractor
  ports:
    - name: http
      port: 8080
      targetPort: http
