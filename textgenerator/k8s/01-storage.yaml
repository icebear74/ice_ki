# ---------------------------------------------------------------------------
# Persistent storage for the textgenerator stack.
#
# Design decision: explicit hostPath PersistentVolumes on the dedicated 1 TB
# volume mounted at /mnt/aistack, instead of a dynamic provisioner. Every data
# set has a well known, directly reachable and easily backed up location on the
# single Ubuntu host.
#
# Run textgenerator/scripts/prepare-host-dirs.sh BEFORE applying these
# manifests (scripts/build.sh does it automatically): the directories must
# exist and be owned by uid/gid 1000, because Kubernetes does NOT apply
# fsGroup to hostPath volumes.
#
# If you move the data to a different path, change STORAGE_ROOT in
# prepare-host-dirs.sh AND every hostPath below - they are not templated.
#
# The capacity values are metadata only: hostPath volumes are not quota
# enforced, so the whole stack shares the free space of /mnt/aistack.
#
# Local volumes survive pod restarts and image upgrades. They do NOT survive
# a disk failure - see the backup section in textgenerator/README.md.
# ---------------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: textgen-hostpath
  labels:
    app.kubernetes.io/part-of: textgenerator
# No dynamic provisioning: every volume below is created statically and bound
# to its claim through claimRef.
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
# SillyTavern config, chats, settings and user data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: textgen-sillytavern-data-pv
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: textgen-hostpath
  claimRef:
    namespace: ai-stack
    name: sillytavern-data-pvc
  hostPath:
    path: /mnt/aistack/sillytavern
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sillytavern-data-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-hostpath
  volumeName: textgen-sillytavern-data-pv
  resources:
    requests:
      storage: 20Gi
---
# Downloaded GGUF / HF model files - by far the largest data set.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: textgen-oobabooga-models-pv
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: textgen-hostpath
  claimRef:
    namespace: ai-stack
    name: oobabooga-models-pvc
  hostPath:
    path: /mnt/aistack/oobabooga/models
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oobabooga-models-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-hostpath
  volumeName: textgen-oobabooga-models-pv
  resources:
    requests:
      storage: 500Gi
---
# Oobabooga character cards and LoRA adapters (mounted with subPath).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: textgen-oobabooga-character-pv
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: textgen-hostpath
  claimRef:
    namespace: ai-stack
    name: oobabooga-character-pvc
  hostPath:
    path: /mnt/aistack/oobabooga/character
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oobabooga-character-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-hostpath
  volumeName: textgen-oobabooga-character-pv
  resources:
    requests:
      storage: 50Gi
---
# Shared character card area. Mounted by SillyTavern (read/write) and by the
# character extractor (read/write) so that neither pod has to reach into the
# private filesystem of the other one.
#
# ReadWriteMany is safe here because both consumers run on the same (single)
# node and simply share the same host directory - no NFS or share-manager is
# involved.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: textgen-shared-characters-pv
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: textgen-hostpath
  claimRef:
    namespace: ai-stack
    name: shared-characters-pvc
  hostPath:
    path: /mnt/aistack/shared/characters
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-characters-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: textgen-hostpath
  volumeName: textgen-shared-characters-pv
  resources:
    requests:
      storage: 20Gi
---
# Extractor working data: structured person profiles, raw model output and
# generated visual prompts.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: textgen-extractor-data-pv
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: textgen-hostpath
  claimRef:
    namespace: ai-stack
    name: extractor-data-pvc
  hostPath:
    path: /mnt/aistack/extractor
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: extractor-data-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-hostpath
  volumeName: textgen-extractor-data-pv
  resources:
    requests:
      storage: 20Gi
---
# Optional ComfyUI data (models, workflows, input, output). The PVC is created
# even when the ComfyUI deployment is scaled to zero, so that image models can
# be staged in advance.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: textgen-comfyui-data-pv
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  capacity:
    storage: 300Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: textgen-hostpath
  claimRef:
    namespace: ai-stack
    name: comfyui-data-pvc
  hostPath:
    path: /mnt/aistack/comfyui
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-data-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-hostpath
  volumeName: textgen-comfyui-data-pv
  resources:
    requests:
      storage: 300Gi
