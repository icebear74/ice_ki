# ---------------------------------------------------------------------------
# Persistent storage for the textgenerator stack.
#
# Design decision: every data set is a dynamically provisioned PersistentVolume
# Claim backed by Longhorn (the default StorageClass of the target cluster).
# No hostPath PersistentVolumes and no manual host directory preparation are
# required any more - Longhorn creates, formats and mounts the volumes.
#
# The stack uses its own StorageClass "textgen-longhorn" instead of the stock
# "longhorn" class for two reasons:
#
#   1. numberOfReplicas: "1" - this is a single node cluster. The default
#      Longhorn class asks for 3 replicas, which can never become healthy on
#      one node and leaves every volume permanently "Degraded".
#   2. reclaimPolicy: Retain - deleting a PVC (or `kubectl delete -k .`) must
#      not destroy downloaded models, chat history or character cards. The
#      Longhorn volume is kept and can be re-attached; clean it up explicitly
#      in the Longhorn UI when it is really no longer needed.
#
# To use the stock class instead, set `storageClassName: longhorn` on every
# claim below (and accept Delete semantics + Degraded volumes on one node).
#
# Prerequisites on the host (see textgenerator/scripts/verify-storage.sh):
#   * open-iscsi  - required by every Longhorn volume
#   * nfs-common  - required by ReadWriteMany volumes (share-manager/NFS)
#
# Longhorn replicates within the cluster; it is NOT a backup. See the backup
# section in textgenerator/README.md and textgenerator/scripts/backup.sh.
# ---------------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: textgen-longhorn
  labels:
    app.kubernetes.io/part-of: textgenerator
provisioner: driver.longhorn.io
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  # Keep the replica on the node that runs the workload. On a single node
  # cluster this is a no-op, but it keeps the intent explicit if a second node
  # is added later.
  dataLocality: "best-effort"
---
# SillyTavern config, chats, settings and user data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sillytavern-data-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-longhorn
  resources:
    requests:
      storage: 5Gi
---
# Downloaded GGUF / HF model files. Sized generously - adjust to the space
# Longhorn actually has available on the node before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oobabooga-models-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-longhorn
  resources:
    requests:
      storage: 200Gi
---
# Oobabooga character cards and LoRA adapters (mounted with subPath).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oobabooga-character-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-longhorn
  resources:
    requests:
      storage: 20Gi
---
# Shared character card area. Mounted by SillyTavern (read/write) and by the
# character extractor (read/write) so that neither pod has to reach into the
# private filesystem of the other one.
#
# ReadWriteMany is served by a Longhorn share-manager pod that exports the
# volume over NFS, so the node needs the nfs-common package. Both consumers
# chown their mount with a privileged initContainer, because fsGroup is not
# applied to RWX volumes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-characters-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: textgen-longhorn
  resources:
    requests:
      storage: 10Gi
---
# Extractor working data: structured person profiles, raw model output and
# generated visual prompts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: extractor-data-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-longhorn
  resources:
    requests:
      storage: 10Gi
---
# Optional ComfyUI data (models, workflows, input, output). The PVC is created
# even when the ComfyUI deployment is scaled to zero, so that image models can
# be staged in advance.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-data-pvc
  namespace: ai-stack
  labels:
    app.kubernetes.io/part-of: textgenerator
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: textgen-longhorn
  resources:
    requests:
      storage: 100Gi
