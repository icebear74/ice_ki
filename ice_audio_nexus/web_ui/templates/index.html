<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ice_audio_nexus – Sprecher-Identifikation</title>
  <style>
    /* ------------------------------------------------------------------ */
    /*  Base                                                               */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --bg-card:   #161b22;
      --bg-hover:  #1f2937;
      --border:    #30363d;
      --accent:    #58a6ff;
      --accent2:   #3fb950;
      --warn:      #d29922;
      --danger:    #f85149;
      --text:      #c9d1d9;
      --text-muted:#8b949e;
      --radius:    8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      height: 100vh;      /* lock to viewport – prevents body from growing with content */
      overflow: hidden;   /* the individual panels scroll, not the page */
      display: flex;
      flex-direction: column;
    }

    /* ------------------------------------------------------------------ */
    /*  Header                                                             */
    /* ------------------------------------------------------------------ */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 18px; color: var(--accent); font-weight: 600; }
    header .tagline { color: var(--text-muted); font-size: 12px; }

    /* ------------------------------------------------------------------ */
    /*  Main layout                                                        */
    /* ------------------------------------------------------------------ */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      flex: 1;
      min-height: 0;          /* allow grid to shrink below content size */
      overflow: hidden;
    }

    /* ------------------------------------------------------------------ */
    /*  Left: video + controls                                            */
    /* ------------------------------------------------------------------ */
    .main-panel {
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      overflow-y: auto;
      min-height: 0;          /* allow panel to shrink and scroll */
    }

    /* Episode selector */
    .episode-bar {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .episode-bar label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-muted); }
    .episode-bar select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: var(--radius);
      font-size: 13px;
      min-width: 220px;
      max-width: 400px;
    }
    #sel-episode { min-width: 300px; }
    .episode-bar select:disabled { opacity: .45; cursor: not-allowed; }
    #btn-load:disabled { opacity: .45; cursor: not-allowed; }
    .btn {
      padding: 7px 16px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary   { background: var(--accent);  color: #0d1117; }
    .btn-success   { background: var(--accent2); color: #0d1117; }
    .btn-warn      { background: var(--warn);    color: #0d1117; }
    .btn-danger    { background: var(--danger);  color: #fff; }
    .btn-ghost     { background: transparent; border: 1px solid var(--border); color: var(--text); }

    /* Video player */
    .player-wrap {
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
    }
    .player-wrap video {
      width: 100%;
      max-height: 60vh;
      display: block;
    }

    /* Speaker overlay badge (top-left of video) */
    #speaker-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,.75);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      transition: opacity .2s;
    }
    #speaker-overlay .speaker-name { color: var(--accent); font-weight: 600; }
    #speaker-overlay .match-info   { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

    /* Timeline bar */
    #timeline-container {
      position: relative;
      height: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
    }
    #timeline-bar {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #timeline-progress {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 0%;
      background: rgba(88,166,255,.2);
      pointer-events: none;
      border-right: 2px solid var(--accent);
      transition: width .2s linear;
    }

    /* ------------------------------------------------------------------ */
    /*  Sidebar                                                           */
    /* ------------------------------------------------------------------ */
    .sidebar {
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;          /* critical: allow sidebar to shrink in grid */
    }
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;         /* tabs row must not shrink */
    }
    .sidebar-tabs button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 10px;
      font-size: 12px;
      transition: color .15s;
      border-bottom: 2px solid transparent;
    }
    .sidebar-tabs button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Tab panes: fill remaining sidebar height and scroll independently */
    .tab-content {
      flex: 1;
      min-height: 0;          /* allow flex child to shrink and overflow-y to work */
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      display: none;
    }
    .tab-content.active { display: flex; flex-direction: column; }

    /* Speaker list items */
    .speaker-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .speaker-card:hover { background: var(--bg-hover); }
    .speaker-card.active { border-color: var(--accent); }
    .speaker-card.suggestion { border-color: var(--warn); }

    .sc-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .sc-label   { font-weight: 600; font-size: 13px; }
    .sc-time    { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .sc-match   { font-size: 11px; margin-top: 4px; }
    .sc-match .match-tag { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
    .tag-matched    { background: rgba(63,185,80,.2);  color: var(--accent2); }
    .tag-suggest    { background: rgba(210,153,34,.2); color: var(--warn); }
    .tag-unknown    { background: rgba(248,81,73,.15); color: var(--danger); }
    .sc-transcript  { color: var(--text-muted); font-size: 11px; margin-top: 4px; font-style: italic; line-height: 1.4; }

    /* Assignment panel (shown below selected speaker card) */
    .assign-panel {
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 8px;
    }
    .assign-panel h4 { font-size: 12px; color: var(--accent); margin-bottom: 8px; }
    .assign-panel select, .assign-panel input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .assign-panel .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    .assign-panel label { font-size: 11px; color: var(--text-muted); }
    .assign-panel .btn  { font-size: 11px; padding: 5px 10px; }

    /* Identity manager */
    .identity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .identity-row .id-name { font-weight: 600; font-size: 13px; }
    .identity-row .id-count { font-size: 11px; color: var(--text-muted); }
    .identity-row .id-actions { display: flex; gap: 4px; }

    /* New identity form */
    .new-identity-form {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-top: 8px;
    }
    .new-identity-form input, .new-identity-form textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .new-identity-form textarea { resize: vertical; min-height: 50px; }

    /* Toasts */
    #toast-container {
      position: fixed;
      bottom: 20px; right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
    }
    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
      animation: slideIn .2s ease;
    }
    .toast.success { border-color: var(--accent2); color: var(--accent2); }
    .toast.warn    { border-color: var(--warn);    color: var(--warn); }
    .toast.error   { border-color: var(--danger);  color: var(--danger); }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }

    /* Utility */
    .section-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase;
                     letter-spacing: .5px; margin-bottom: 8px; }
    .empty-state   { text-align: center; color: var(--text-muted); padding: 32px; font-size: 13px; }
  </style>
</head>
<body>

<!-- ================================================================== -->
<!--  Header                                                             -->
<!-- ================================================================== -->
<header>
  <h1>🎙️ ice_audio_nexus</h1>
  <span class="tagline">Multi-Vektor Sprecher-Identifikation · MariaDB 11.7</span>
</header>

<!-- ================================================================== -->
<!--  App layout                                                         -->
<!-- ================================================================== -->
<div class="app-layout">

  <!-- ================================================================ -->
  <!--  Left: video + controls                                          -->
  <!-- ================================================================ -->
  <div class="main-panel">

    <!-- Library-driven Episode selector -->
    <div class="episode-bar">
      <label>
        Serie / Film
        <select id="sel-series" onchange="onSeriesChange()">
          <option value="">— Bibliothek lädt… —</option>
        </select>
      </label>
      <label id="lbl-season" style="display:none">
        Staffel
        <select id="sel-season" onchange="onSeasonChange()">
          <option value="">— Staffel wählen —</option>
        </select>
      </label>
      <label id="lbl-episode" style="display:none">
        Episode
        <select id="sel-episode" onchange="onEpisodeChange()">
          <option value="">— Episode wählen —</option>
        </select>
      </label>
      <!-- Hidden values consumed by loadEpisode() -->
      <input id="inp-series"    type="hidden" />
      <input id="inp-episode"   type="hidden" />
      <input id="inp-videopath" type="hidden" />
      <button class="btn btn-primary" id="btn-load" onclick="loadEpisode()" disabled>▶ Laden</button>
    </div>

    <!-- Player -->
    <div class="player-wrap">
      <video id="player" controls preload="metadata"></video>
      <div id="speaker-overlay" style="display:none;">
        <div class="speaker-name" id="ov-name">—</div>
        <div class="match-info"  id="ov-match"></div>
      </div>
    </div>

    <!-- Timeline -->
    <div id="timeline-container" title="Klicken zum Springen">
      <canvas id="timeline-bar"></canvas>
      <div id="timeline-progress"></div>
    </div>

  </div>

  <!-- ================================================================ -->
  <!--  Sidebar                                                          -->
  <!-- ================================================================ -->
  <div class="sidebar">
    <div class="sidebar-tabs">
      <button class="active" onclick="switchTab('segments', this)">Segmente</button>
      <button onclick="switchTab('identities', this)">Identitäten</button>
    </div>

    <!-- Tab: Segmente -->
    <div id="tab-segments" class="tab-content active">
      <div id="segments-list">
        <div class="empty-state">Lade eine Episode, um Segmente zu sehen.</div>
      </div>
    </div>

    <!-- Tab: Identitäten -->
    <div id="tab-identities" class="tab-content">
      <div class="section-title">Bekannte Identitäten</div>
      <div id="identities-list"></div>

      <div class="new-identity-form" style="margin-top:12px;">
        <div class="section-title">Neue Identität anlegen</div>
        <input id="new-id-name" type="text" placeholder="Name (z.B. Jean-Luc Picard)" />
        <textarea id="new-id-desc" placeholder="Beschreibung (optional)"></textarea>
        <button class="btn btn-primary" style="width:100%" onclick="createIdentity()">+ Anlegen</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ================================================================== -->
<!--  JavaScript                                                         -->
<!-- ================================================================== -->
<script>
/* -------------------------------------------------------------------- */
/*  State                                                                */
/* -------------------------------------------------------------------- */
let segments        = [];
let identities      = [];
let library         = [];   // [{name, seasons:[{name, episodes:[{title,video_path,segment_count}]}]}]
let currentSeg      = null;
let videoDuration   = 0;
let seriesName      = "";
let episodeTitle    = "";
let currentVideoPath = "";  // absolute path currently loaded into the player

const player      = document.getElementById("player");
const overlay     = document.getElementById("speaker-overlay");
const ovName      = document.getElementById("ov-name");
const ovMatch     = document.getElementById("ov-match");
const tlBar       = document.getElementById("timeline-bar");
const tlProgress  = document.getElementById("timeline-progress");
const tlContainer = document.getElementById("timeline-container");

/* -------------------------------------------------------------------- */
/*  Tab switching                                                        */
/* -------------------------------------------------------------------- */
function switchTab(name, btn) {
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".sidebar-tabs button").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  btn.classList.add("active");
}

/* -------------------------------------------------------------------- */
/*  Toast                                                                */
/* -------------------------------------------------------------------- */
function toast(msg, type = "success") {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

/* -------------------------------------------------------------------- */
/*  Library – load from DB via /api/library                              */
/* -------------------------------------------------------------------- */
async function loadLibrary() {
  const resp = await fetch("/api/library");
  if (!resp.ok) {
    toast("Bibliothek konnte nicht geladen werden.", "error");
    return;
  }
  library = await resp.json();

  const sel = document.getElementById("sel-series");
  if (!library.length) {
    sel.innerHTML = '<option value="">— Noch keine gescannten Videos —</option>';
    return;
  }
  sel.innerHTML = '<option value="">— Serie / Film wählen —</option>';
  library.forEach(entry => {
    const opt = document.createElement("option");
    opt.value = entry.name;
    const totalSegs = entry.seasons.reduce(
      (a, s) => a + s.episodes.reduce((b, e) => b + e.segment_count, 0), 0);
    opt.textContent = entry.name + (totalSegs > 0 ? `  (${totalSegs} Seg.)` : "");
    sel.appendChild(opt);
  });
}

/* -------------------------------------------------------------------- */
/*  Library dropdown cascade: Series → Season → Episode                 */
/* -------------------------------------------------------------------- */
function onSeriesChange() {
  const name = document.getElementById("sel-series").value;
  document.getElementById("inp-series").value   = name;
  document.getElementById("inp-episode").value  = "";
  document.getElementById("inp-videopath").value = "";
  document.getElementById("btn-load").disabled  = true;

  const seasonSel = document.getElementById("sel-season");
  const episodeSel = document.getElementById("sel-episode");
  seasonSel.innerHTML  = '<option value="">— Staffel wählen —</option>';
  episodeSel.innerHTML = '<option value="">— Episode wählen —</option>';
  document.getElementById("lbl-season").style.display  = "none";
  document.getElementById("lbl-episode").style.display = "none";

  if (!name) return;
  const entry = library.find(s => s.name === name);
  if (!entry) return;

  if (entry.seasons.length === 1) {
    // Single season / movie – skip the season picker
    populateEpisodes(entry.seasons[0].episodes);
  } else {
    document.getElementById("lbl-season").style.display = "";
    entry.seasons.forEach(season => {
      const opt = document.createElement("option");
      opt.value = season.name;
      const processed = season.episodes.filter(e => e.segment_count > 0).length;
      opt.textContent = `${season.name}  (${season.episodes.length} Folgen${processed ? ", " + processed + " ✓" : ""})`;
      seasonSel.appendChild(opt);
    });
  }
}

function onSeasonChange() {
  const seriesName = document.getElementById("sel-series").value;
  const seasonName = document.getElementById("sel-season").value;
  document.getElementById("inp-episode").value   = "";
  document.getElementById("inp-videopath").value  = "";
  document.getElementById("btn-load").disabled   = true;
  document.getElementById("lbl-episode").style.display = "none";
  if (!seasonName) return;

  const entry  = library.find(s => s.name === seriesName);
  const season = entry?.seasons.find(s => s.name === seasonName);
  if (season) populateEpisodes(season.episodes);
}

function populateEpisodes(episodes) {
  const sel = document.getElementById("sel-episode");
  sel.innerHTML = '<option value="">— Episode wählen —</option>';
  episodes.forEach(ep => {
    const opt = document.createElement("option");
    opt.value = JSON.stringify({ title: ep.title, path: ep.video_path });

    // Friendly display name: strip extension + episode code prefix from filename
    const filename = (ep.video_path || ep.title).split("/").pop();
    let pretty = filename.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
    pretty = pretty.replace(/^[Ss]\d+[Ee]\d+[-– ]+/, "").trim();
    const label = pretty ? `${ep.title}  –  ${pretty}` : ep.title;

    const badge = ep.segment_count > 0 ? "✓ " : "";
    opt.textContent = badge + label
      + (ep.segment_count > 0 ? `  (${ep.segment_count} Seg.)` : "");
    if (ep.segment_count > 0) opt.style.color = "#3fb950";
    sel.appendChild(opt);
  });
  document.getElementById("lbl-episode").style.display = "";
}

function onEpisodeChange() {
  const val = document.getElementById("sel-episode").value;
  document.getElementById("btn-load").disabled = !val;
  if (!val) {
    document.getElementById("inp-episode").value   = "";
    document.getElementById("inp-videopath").value  = "";
    return;
  }
  const ep = JSON.parse(val);
  document.getElementById("inp-episode").value   = ep.title;
  document.getElementById("inp-videopath").value  = ep.path || "";
}

/* -------------------------------------------------------------------- */
/*  Load identities                                                      */
/* -------------------------------------------------------------------- */
async function loadIdentities() {
  const resp = await fetch("/api/identities");
  if (!resp.ok) return;
  identities = await resp.json();
  renderIdentities();
}

function renderIdentities() {
  const list = document.getElementById("identities-list");
  if (!identities.length) {
    list.innerHTML = '<div class="empty-state">Noch keine Identitäten.</div>';
    return;
  }
  list.innerHTML = identities.map(id => `
    <div class="identity-row">
      <div>
        <div class="id-name">${esc(id.name)}</div>
        <div class="id-count">${id.sample_count} Vektor(en)</div>
      </div>
      <div class="id-actions">
        <button class="btn btn-ghost" style="font-size:11px;padding:4px 8px;"
                onclick="viewSamples(${id.id}, '${esc(id.name)}')">Samples</button>
      </div>
    </div>
  `).join("");
}

async function createIdentity() {
  const name = document.getElementById("new-id-name").value.trim();
  const desc = document.getElementById("new-id-desc").value.trim();
  if (!name) { toast("Bitte einen Namen eingeben.", "warn"); return; }
  const resp = await fetch("/api/identities", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, description: desc})
  });
  if (resp.ok) {
    toast("Identität angelegt: " + name);
    document.getElementById("new-id-name").value = "";
    document.getElementById("new-id-desc").value = "";
    await loadIdentities();
  } else {
    toast("Fehler beim Anlegen.", "error");
  }
}

async function viewSamples(identityId, identityName) {
  const resp = await fetch(`/api/identities/${identityId}/samples`);
  if (!resp.ok) { toast("Fehler", "error"); return; }
  const samples = await resp.json();
  const win = window.open("", "_blank");
  if (!win) { toast("Popup blockiert.", "warn"); return; }
  win.document.write(`<html><head><title>Samples – ${identityName}</title>
  <style>body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;padding:20px;}
  table{width:100%;border-collapse:collapse;}th,td{padding:8px;border-bottom:1px solid #30363d;text-align:left;}
  th{color:#58a6ff;}</style></head><body>
  <h2>Voice Samples – ${identityName}</h2>
  <table><thead><tr><th>ID</th><th>Kontext</th><th>Bestätigt</th><th>Erstellt</th></tr></thead><tbody>`
  + samples.map(s => `<tr><td>${s.id}</td><td>${s.context||"—"}</td>
  <td>${s.is_confirmed?"✅":"❌"}</td><td>${s.created_at||""}</td></tr>`).join("")
  + `</tbody></table></body></html>`);
}

/* -------------------------------------------------------------------- */
/*  Load episode: start video + fetch segments                          */
/* -------------------------------------------------------------------- */
async function loadEpisode() {
  seriesName        = document.getElementById("inp-series").value.trim();
  episodeTitle      = document.getElementById("inp-episode").value.trim();
  const videoPath   = document.getElementById("inp-videopath").value.trim();

  if (!seriesName || !episodeTitle) {
    toast("Bitte Serie und Episode aus der Bibliothek wählen.", "warn");
    return;
  }

  if (videoPath) {
    currentVideoPath = videoPath;
    player.src = `/stream?path=${encodeURIComponent(videoPath)}`;
    player.load();
  }

  await fetchSegments();
  await loadIdentities();
}

async function fetchSegments() {
  if (!seriesName || !episodeTitle) return;
  const resp = await fetch(
    `/api/segments?series=${encodeURIComponent(seriesName)}&episode=${encodeURIComponent(episodeTitle)}`
  );
  if (!resp.ok) { toast("Fehler beim Laden der Segmente.", "error"); return; }
  segments = await resp.json();
  renderSegments();
  drawTimeline();
}

/* -------------------------------------------------------------------- */
/*  Render segment list in sidebar                                       */
/* -------------------------------------------------------------------- */
function renderSegments() {
  const list = document.getElementById("segments-list");
  if (!segments.length) {
    list.innerHTML = '<div class="empty-state">Keine Segmente für diese Episode.</div>';
    return;
  }
  list.innerHTML = segments.map(seg => segCard(seg)).join("");
}

function segCard(seg) {
  const start = msToTime(seg.start_ms);
  const label = seg.identity_name || seg.speaker_label || "Unbekannt";
  let matchHtml = "";
  let cardClass = "speaker-card";

  if (seg.identity_id) {
    const pct = seg.match_distance != null
      ? Math.round((1 - seg.match_distance) * 100) + "% Match" : "";
    const ctx = seg.matched_sample_context ? ` via "${seg.matched_sample_context}"` : "";
    if (seg.is_suggestion) {
      cardClass += " suggestion";
      matchHtml = `<div class="sc-match"><span class="match-tag tag-suggest">⚠ Vorschlag</span>
        Erkannt als <strong>${esc(seg.identity_name)}</strong>${esc(ctx)} · ${pct}</div>`;
    } else {
      matchHtml = `<div class="sc-match"><span class="match-tag tag-matched">✓ Erkannt</span>
        <strong>${esc(seg.identity_name)}</strong>${esc(ctx)} · ${pct}</div>`;
    }
  } else {
    matchHtml = `<div class="sc-match"><span class="match-tag tag-unknown">? Unbekannt</span></div>`;
  }

  const transcript = seg.transcript
    ? `<div class="sc-transcript">"${esc(seg.transcript.slice(0,120))}${seg.transcript.length>120?"…":""}"</div>`
    : "";

  return `
    <div class="speaker-card${cardClass.replace("speaker-card","")}"
         id="seg-card-${seg.id}"
         onclick="selectSegment(${seg.id})">
      <div class="sc-header">
        <span class="sc-label">${esc(label)}</span>
        <span class="sc-time">${start}</span>
      </div>
      ${matchHtml}
      ${transcript}
    </div>
    <div id="assign-panel-${seg.id}" style="display:none;"></div>
  `;
}

/* -------------------------------------------------------------------- */
/*  Segment selection: jump to video position + show assignment panel   */
/* -------------------------------------------------------------------- */
function selectSegment(segId) {
  const seg = segments.find(s => s.id === segId);
  if (!seg) return;

  // ── Jump to the segment start in the video ──────────────────────────
  if (currentVideoPath) {
    const seekSec = seg.start_ms / 1000;
    // Re-request the stream from the exact start position.
    // This is reliable for fragmented MP4 pipe streams where the browser
    // cannot seek freely in an incomplete buffer.
    player.src = `/stream?path=${encodeURIComponent(currentVideoPath)}&seek=${seekSec}`;
    player.load();
    player.play().catch(() => {});
  }

  // ── Toggle assignment panel ──────────────────────────────────────────
  const panelEl = document.getElementById("assign-panel-" + segId);
  if (!panelEl) return;
  if (panelEl.style.display === "block") {
    panelEl.style.display = "none";
    return;
  }
  document.querySelectorAll('[id^="assign-panel-"]').forEach(el => el.style.display = "none");
  document.querySelectorAll(".speaker-card").forEach(c => c.classList.remove("active"));
  document.getElementById("seg-card-" + segId)?.classList.add("active");
  panelEl.style.display = "block";
  panelEl.innerHTML = buildAssignPanel(seg);
}

function buildAssignPanel(seg) {
  const opts = identities.map(id =>
    `<option value="${id.id}" ${seg.identity_id === id.id ? "selected" : ""}>${esc(id.name)}</option>`
  ).join("");

  const suggestionNote = seg.is_suggestion
    ? `<div style="color:var(--warn);font-size:11px;margin-bottom:8px;">
        ⚠ Dies ist ein Vorschlag – die Distanz war etwas höher (${seg.match_distance?.toFixed(3)}).
        Bestätige oder weise einer anderen Identität zu.
       </div>` : "";

  return `
    <div class="assign-panel">
      <h4>🎯 Sprecher zuweisen – Segment ${seg.id}</h4>
      ${suggestionNote}
      <div>Bestehende Identität:</div>
      <select id="ap-identity-${seg.id}">
        <option value="">— Unbekannt —</option>
        ${opts}
      </select>
      <input id="ap-context-${seg.id}" type="text"
             placeholder="Kontext (z.B. TNG S01E03)" value="${esc(seg.matched_sample_context||"")}" />

      <div class="row">
        <input type="checkbox" id="ap-addsample-${seg.id}" />
        <label for="ap-addsample-${seg.id}">
          Diesen Vektor als neues Sample speichern<br>
          <span style="font-size:10px;color:var(--text-muted)">
            (empfohlen bei Altersunterschied / neuer Ära)
          </span>
        </label>
      </div>

      <div style="margin-top:4px;font-size:11px;color:var(--text-muted)">— oder neue Identität —</div>
      <input id="ap-newname-${seg.id}" type="text" placeholder="Neuer Name" />

      <div class="row" style="margin-top:8px;">
        <button class="btn btn-success" onclick="applyAssign(${seg.id})">✓ Zuweisen</button>
        <button class="btn btn-ghost"   onclick="document.getElementById('assign-panel-${seg.id}').style.display='none'">Abbrechen</button>
      </div>
    </div>
  `;
}

async function applyAssign(segId) {
  const seg        = segments.find(s => s.id === segId);
  const identityId = parseInt(document.getElementById("ap-identity-" + segId)?.value) || null;
  const newName    = document.getElementById("ap-newname-"  + segId)?.value.trim();
  const context    = document.getElementById("ap-context-"  + segId)?.value.trim();
  const addSample  = document.getElementById("ap-addsample-"+ segId)?.checked;

  if (!identityId && !newName) {
    toast("Bitte eine Identität wählen oder neuen Namen eingeben.", "warn");
    return;
  }

  const body = {
    identity_id: identityId,
    new_name:    newName  || undefined,
    context:     context  || "",
    add_sample:  addSample,
    segment_id:  segId,
  };

  const resp = await fetch(`/api/segments/${segId}/assign`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });

  if (resp.ok) {
    toast("Zugewiesen ✓");
    await fetchSegments();
    await loadIdentities();
  } else {
    const err = await resp.json().catch(() => ({}));
    toast("Fehler: " + (err.detail || resp.statusText), "error");
  }
}

/* -------------------------------------------------------------------- */
/*  Video → overlay sync                                                 */
/* -------------------------------------------------------------------- */
player.addEventListener("timeupdate", () => {
  const nowMs = player.currentTime * 1000;
  const dur   = player.duration || 0;
  if (dur > 0) {
    tlProgress.style.width = (player.currentTime / dur * 100) + "%";
  }
  updateOverlay(nowMs);
});

player.addEventListener("loadedmetadata", () => {
  videoDuration = player.duration * 1000;
  drawTimeline();
});

function updateOverlay(nowMs) {
  const active = segments.find(s => s.start_ms <= nowMs && s.end_ms >= nowMs);
  if (!active) { overlay.style.display = "none"; return; }
  overlay.style.display = "block";

  const name = active.identity_name || active.speaker_label || "Unbekannt";
  ovName.textContent = name;

  if (active.identity_id && active.match_distance != null) {
    const pct = Math.round((1 - active.match_distance) * 100);
    const ctx = active.matched_sample_context ? ` · via „${active.matched_sample_context}"` : "";
    ovMatch.textContent = `${pct}% Match${ctx}`;
  } else if (active.is_suggestion) {
    ovMatch.textContent = "⚠ Vorschlag – Bestätigung ausstehend";
  } else {
    ovMatch.textContent = "";
  }

  document.querySelectorAll(".speaker-card").forEach(c => c.classList.remove("active"));
  const card = document.getElementById("seg-card-" + active.id);
  if (card) {
    card.classList.add("active");
    card.scrollIntoView({behavior: "smooth", block: "nearest"});
  }
}

/* -------------------------------------------------------------------- */
/*  Timeline canvas                                                      */
/* -------------------------------------------------------------------- */
function drawTimeline() {
  const canvas = tlBar;
  const ctx    = canvas.getContext("2d");
  const W      = tlContainer.offsetWidth;
  const H      = tlContainer.offsetHeight;
  canvas.width  = W;
  canvas.height = H;
  ctx.clearRect(0, 0, W, H);

  if (!segments.length || !videoDuration) return;

  const colorMap = {};
  let colorIdx   = 0;
  const COLORS   = [
    "#58a6ff", "#3fb950", "#d29922", "#f85149",
    "#bc8cff", "#79c0ff", "#56d364", "#ff7b72",
  ];

  segments.forEach(seg => {
    const key = seg.identity_id || seg.speaker_label;
    if (!colorMap[key]) colorMap[key] = COLORS[colorIdx++ % COLORS.length];
    const x1 = (seg.start_ms / videoDuration) * W;
    const x2 = (seg.end_ms   / videoDuration) * W;
    ctx.fillStyle = colorMap[key];
    ctx.fillRect(x1, 0, Math.max(x2 - x1, 2), H);
  });
}

tlContainer.addEventListener("click", e => {
  const rect  = tlContainer.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  if (player.duration && currentVideoPath) {
    const seekSec = ratio * player.duration;
    player.src = `/stream?path=${encodeURIComponent(currentVideoPath)}&seek=${seekSec}`;
    player.load();
    player.play().catch(() => {});
  }
});

/* -------------------------------------------------------------------- */
/*  Helpers                                                              */
/* -------------------------------------------------------------------- */
function msToTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  return h > 0
    ? `${h}:${String(m%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`
    : `${m}:${String(s%60).padStart(2,"0")}`;
}

function esc(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* -------------------------------------------------------------------- */
/*  Boot                                                                 */
/* -------------------------------------------------------------------- */
(async () => {
  await loadLibrary();
  await loadIdentities();
})();
</script>
