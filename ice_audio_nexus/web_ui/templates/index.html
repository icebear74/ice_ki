<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ice_audio_nexus – Step-1 visual discovery</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, Arial, sans-serif; background: var(--bg); color: var(--text); }
    .layout { display: grid; grid-template-columns: 340px 1fr 360px; height: 100vh; gap: 10px; padding: 10px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .panel h2 { margin: 0; padding: 12px; border-bottom: 1px solid var(--line); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
    .scroll { overflow: auto; padding: 10px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .pill { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 8px; }
    .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; cursor: pointer; }
    .item:hover { border-color: var(--accent); }
    .item.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .video-wrap { position: relative; background: #000; border-bottom: 1px solid var(--line); }
    video { width: 100%; max-height: 56vh; display: block; background: #000; }
    canvas { position: absolute; inset: 0; pointer-events: none; }
    .toolbar { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    button, select, input { background: #0b1220; color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; }
    button { cursor: pointer; }
    .btn-main { border-color: var(--accent); color: #e0f2fe; }
    .btn-ok { border-color: var(--ok); color: #bbf7d0; }
    .btn-warn { border-color: var(--warn); color: #fde68a; }
    .btn-bad { border-color: var(--bad); color: #fecaca; }
    .meta { color: var(--muted); font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .thumb { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #020617; min-height: 120px; object-fit: cover; }
    .thumb-wrap { position: relative; }
    .thumb-wrap .remove-btn {
      display: none; position: absolute; top: 3px; right: 3px;
      background: rgba(239,68,68,.85); color: #fff; border: none;
      border-radius: 50%; width: 20px; height: 20px; font-size: 12px;
      line-height: 20px; text-align: center; cursor: pointer; padding: 0;
    }
    .thumb-wrap:hover .remove-btn { display: block; }
    .thumb-caption { font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; }
    .status-assigned { color: var(--ok); }
    .status-candidate { color: var(--accent); }
    .status-background { color: var(--warn); }
    .status-ignored { color: var(--bad); }
    .small { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="layout">
    <section class="panel">
      <h2>Productions / Videos</h2>
      <div class="toolbar" style="flex-wrap:wrap; gap:6px;">
        <button class="btn-main" onclick="loadLibrary()">Reload</button>
        <button class="btn-ok" onclick="triggerRematch()">Re-match</button>
        <button class="btn-warn" onclick="showScanDirDialog()">Scan directory…</button>
      </div>
      <!-- Scan directory dialog (hidden by default) -->
      <div id="scanDirDialog" style="display:none; padding:8px; border-bottom:1px solid var(--line); font-size:12px;">
        <div style="margin-bottom:4px; color:var(--accent); font-weight:600;">Verzeichnis scannen</div>
        <input id="scanDirPath" placeholder="Absoluter Pfad zum Verzeichnis" style="width:100%; margin-bottom:4px;" />
        <input id="scanDirProd" placeholder="Produktionsname (optional, sonst Ordnername)" style="width:100%; margin-bottom:4px;" />
        <div style="display:flex; gap:6px; align-items:center; margin-bottom:4px;">
          <label style="display:flex;align-items:center;gap:4px;">
            <input type="checkbox" id="scanDirRescan" /> Completed neu scannen
          </label>
          <label style="display:flex;align-items:center;gap:4px;">
            <input type="checkbox" id="scanDirRecursive" /> Rekursiv
          </label>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-ok" style="flex:1" onclick="submitScanDir()">Starten</button>
          <button onclick="hideScanDirDialog()">Abbrechen</button>
        </div>
        <div id="scanDirStatus" class="small" style="margin-top:4px;"></div>
      </div>
      <div id="library" class="scroll"></div>
    </section>

    <section class="panel">
      <h2>Video + Overlay</h2>
      <div class="video-wrap">
        <video id="player" controls></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="toolbar">
        <button onclick="jumpToTrackStart()">Jump to selected track</button>
        <span id="videoMeta" class="meta">No video selected</span>
      </div>
      <div class="toolbar" style="gap:6px; padding-top:4px;">
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;">
          <input type="checkbox" id="filterClear" onchange="loadTracks()" />
          Clear only
        </label>
        <select id="filterStatus" onchange="loadTracks()" style="font-size:12px;padding:4px 6px;">
          <option value="">All status</option>
          <option value="candidate">Candidate</option>
          <option value="assigned">Assigned</option>
          <option value="background">Background</option>
          <option value="unknown">Unknown</option>
          <option value="ignored">Ignored</option>
        </select>
        <span id="trackCount" class="meta" style="margin-left:auto;font-size:11px;"></span>
      </div>
      <div id="tracks" class="scroll"></div>
    </section>

    <section class="panel">
      <h2>Seed / Track review</h2>
      <div class="scroll">
        <div id="trackDetails" class="small">Select a track to review and assign.</div>
        <hr style="border-color:#334155; margin:14px 0;" />
        <div class="small" style="margin-bottom:6px;">Seed-first workflow prep</div>
        <div class="grid">
          <input id="groupLabel" placeholder="visual_person_001" />
          <select id="workflowStage">
            <option value="seed_discovery">Seed discovery</option>
            <option value="review">Review</option>
            <option value="finished">Finished</option>
            <option value="expansion">Expansion</option>
          </select>
          <select id="reviewState">
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="needs_split">Needs split</option>
            <option value="irrelevant">Irrelevant</option>
            <option value="ignored">Ignored</option>
          </select>
          <select id="expansionState">
            <option value="blocked">Expansion blocked</option>
            <option value="ready">Expansion ready</option>
            <option value="running">Expansion running</option>
            <option value="done">Expansion done</option>
          </select>
        </div>
        <input id="workflowNotes" placeholder="Review notes / why this group matters" style="width:100%; margin-top:8px;" />
        <div class="row" style="margin-top:8px;">
          <button class="btn-main" onclick="saveWorkflow()">Save seed workflow</button>
        </div>
        <hr style="border-color:#334155; margin:14px 0;" />
        <div class="small" style="margin-bottom:6px;">Manual assignment (internal: real person, optional role for UI/context)</div>
        <div class="grid">
          <input id="newActorName" placeholder="New actor name" />
          <select id="roleSelect">
            <option value="">Optional role / persona</option>
          </select>
        </div>
        <input id="newRoleName" placeholder="Optional new role / persona name" style="width:100%; margin-top:8px;" />
        <div class="row" style="margin-top:8px;">
          <select id="actorSelect" style="flex:1"></select>
          <button class="btn-ok" onclick="assignTrack()">Assign</button>
        </div>
        <div class="row" style="margin-top:8px;">
          <button class="btn-warn" onclick="setTrackStatus('unknown')">Unknown</button>
          <button class="btn-warn" onclick="setTrackStatus('background')">Background</button>
          <button class="btn-bad" onclick="setTrackStatus('ignored')">Ignore</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    let libraryData = [];
    let currentVideo = null;
    let currentTracks = [];
    let overlayEvents = [];
    let selectedTrack = null;
    let actors = [];
    let roles = [];

    const player = document.getElementById('player');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');

    function statusClass(status) {
      return `status-${status || 'candidate'}`;
    }

    function msToClock(ms) {
      const s = Math.floor((ms || 0) / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const ss = s % 60;
      return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
    }

    async function jsonFetch(url, init) {
      const res = await fetch(url, init);
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(txt || `HTTP ${res.status}`);
      }
      return await res.json();
    }

    async function loadActors() {
      actors = await jsonFetch('/api/actors');
      const sel = document.getElementById('actorSelect');
      sel.innerHTML = `<option value="">Select actor</option>` +
        actors.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    }

    async function loadRoles() {
      roles = await jsonFetch('/api/roles');
      const sel = document.getElementById('roleSelect');
      sel.innerHTML = `<option value="">Optional role / persona</option>` +
        roles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
    }

    async function loadLibrary() {
      libraryData = await jsonFetch('/api/library');
      const root = document.getElementById('library');
      if (!libraryData.length) {
        root.innerHTML = '<div class="small">No scanned productions yet. Run scanner first.</div>';
        return;
      }
      root.innerHTML = libraryData.map(prod => `
        <div class="item">
          <div class="row"><strong>${prod.title}</strong><span class="pill">${prod.production_type}</span>${prod.season_label ? `<span class="pill">${prod.season_label}</span>` : ''}</div>
          <div class="small" style="margin-top:6px;">
            ${prod.videos.map(v => `
              <div class="item" onclick="selectVideo(${v.id}, event)">
                <div class="row">
                  <span>${v.title}</span>
                  <span class="pill">${v.scan_status}</span>
                  <button class="btn-warn" style="font-size:10px;padding:2px 6px;margin-left:auto;" onclick="rescanVideo(${v.id}, event)">↻</button>
                </div>
                <div class="small">${v.episode_code || '—'} · clear ${v.clear_track_count}/${v.track_count}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    async function rescanVideo(videoId, event) {
      event.stopPropagation();
      if (!confirm('Alle Scan-Daten für dieses Video löschen und neu scannen?')) return;
      try {
        await jsonFetch(`/api/videos/${videoId}/rescan`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
        alert('Rescan gestartet. Status wechselt auf "scanning". Reload nach Abschluss.');
        await loadLibrary();
      } catch (e) {
        alert('Rescan-Fehler: ' + e.message);
      }
    }

    function showScanDirDialog() {
      document.getElementById('scanDirDialog').style.display = 'block';
    }
    function hideScanDirDialog() {
      document.getElementById('scanDirDialog').style.display = 'none';
      document.getElementById('scanDirStatus').textContent = '';
    }
    async function submitScanDir() {
      const dir = document.getElementById('scanDirPath').value.trim();
      const prod = document.getElementById('scanDirProd').value.trim();
      const rescan = document.getElementById('scanDirRescan').checked;
      const recursive = document.getElementById('scanDirRecursive').checked;
      if (!dir) { alert('Bitte Verzeichnispfad angeben.'); return; }
      const statusEl = document.getElementById('scanDirStatus');
      statusEl.textContent = 'Starte Scan …';
      try {
        const result = await jsonFetch('/api/scan/directory', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ directory: dir, production: prod || null, rescan, recursive })
        });
        statusEl.textContent = `Scan gestartet: ${result.directory}`;
        setTimeout(loadLibrary, 3000);
      } catch (e) {
        statusEl.textContent = 'Fehler: ' + e.message;
      }
    }

    async function selectVideo(videoId, event) {
      event.stopPropagation();
      document.querySelectorAll('#library .item').forEach(x => x.classList.remove('active'));
      if (event.currentTarget) event.currentTarget.classList.add('active');

      const selected = libraryData.flatMap(p => p.videos).find(v => v.id === videoId);
      currentVideo = { id: videoId, path: selected?.video_path || '' };
      document.getElementById('videoMeta').textContent = `${currentVideo.path}`;
      player.src = `/stream/${videoId}`;
      await player.play().catch(() => {});
      await loadTracks();
      await loadOverlay();
    }

    function renderTracks() {
      const root = document.getElementById('tracks');
      if (!currentTracks.length) {
        root.innerHTML = '<div class="small">No tracks available for this video.</div>';
        return;
      }
      root.innerHTML = currentTracks.map(t => `
        <div class="item ${selectedTrack && selectedTrack.id===t.id ? 'active' : ''}" onclick="selectTrack(${t.id})">
          <div class="row">
            <strong>#${t.id}</strong>
            <span class="pill ${statusClass(t.status)}">${t.status}</span>
            ${t.is_clear ? '<span class="pill">clear</span>' : '<span class="pill">low</span>'}
            ${t.seed_workflow?.group_label ? `<span class="pill">${t.seed_workflow.group_label}</span>` : ''}
          </div>
          <div class="small">${msToClock(t.start_ms)} → ${msToClock(t.end_ms)} · q=${(t.quality_score||0).toFixed(2)} · rel=${(t.relevance_score||0).toFixed(2)}</div>
          <div class="small">seed: ${t.seed_workflow?.review_state || 'pending'} · ${t.seed_workflow?.stage || 'review'}</div>
          <div class="small">${t.assigned_actor_name || t.match_actor_name || 'unassigned'}</div>
        </div>
      `).join('');
    }

    async function loadTracks() {
      if (!currentVideo) return;
      const clearOnly = document.getElementById('filterClear').checked;
      const status = document.getElementById('filterStatus').value;
      let url = `/api/videos/${currentVideo.id}/tracks`;
      const params = [];
      if (clearOnly) params.push('clear_only=true');
      if (status) params.push(`status=${encodeURIComponent(status)}`);
      if (params.length) url += '?' + params.join('&');
      currentTracks = await jsonFetch(url);
      document.getElementById('trackCount').textContent = `${currentTracks.length} tracks`;
      renderTracks();
      if (selectedTrack) {
        const newSel = currentTracks.find(t => t.id === selectedTrack.id);
        if (newSel) await selectTrack(newSel.id);
      }
    }

    async function loadOverlay() {
      if (!currentVideo) return;
      overlayEvents = await jsonFetch(`/api/videos/${currentVideo.id}/overlay`);
    }

    function drawOverlay() {
      const vw = player.videoWidth || 0;
      const vh = player.videoHeight || 0;
      if (!vw || !vh) return;
      canvas.width = player.clientWidth;
      canvas.height = player.clientHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = player.currentTime * 1000;
      const windowMs = 200;
      const active = overlayEvents.filter(e => Math.abs(e.timestamp_ms - t) <= windowMs);
      const sx = canvas.width / vw;
      const sy = canvas.height / vh;
      for (const e of active) {
        const [x,y,w,h] = e.bbox;
        const color = e.status === 'assigned' ? '#22c55e' : (e.status === 'ignored' ? '#ef4444' : '#38bdf8');
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(x*sx, y*sy, w*sx, h*sy);
        ctx.fillStyle = color;
        ctx.font = '12px sans-serif';
        const label = `${e.label || 'track'} ${(e.confidence || 0).toFixed(2)}`;
        ctx.fillText(label, x*sx + 2, Math.max(12, y*sy - 6));
      }
      requestAnimationFrame(drawOverlay);
    }

    async function removeDetection(detectionId) {
      if (!selectedTrack) return;
      try {
        await jsonFetch(`/api/detections/${detectionId}`, { method: 'DELETE' });
      } catch (e) {
        alert('Failed to remove detection: ' + e.message);
        return;
      }
      // Reload just this track's detail view
      await selectTrack(selectedTrack.id);
    }

    async function selectTrack(trackId) {
      selectedTrack = await jsonFetch(`/api/tracks/${trackId}`);
      renderTracks();
      const d = selectedTrack;
      const workflow = d.seed_workflow || {};
      const repSrc = d.representative_image_path ? `/faces/${d.representative_image_path}` : '';
      const thumbsHtml = (d.detections || []).map(x => {
        const conf = x.confidence != null ? `conf ${(x.confidence).toFixed(2)}` : '';
        const sharp = x.sharpness != null ? `sh ${(x.sharpness).toFixed(1)}` : '';
        const caption = [conf, sharp].filter(Boolean).join(' · ');
        return `
          <div class="thumb-wrap">
            <img class="thumb" src="/faces/${x.crop_image_path}" title="${caption}" />
            <button class="remove-btn" onclick="removeDetection(${x.id})" title="Aus Cluster entfernen">×</button>
            ${caption ? `<div class="thumb-caption">${caption}</div>` : ''}
          </div>`;
      }).join('');
      document.getElementById('groupLabel').value = workflow.group_label || '';
      document.getElementById('workflowStage').value = workflow.stage || 'review';
      document.getElementById('reviewState').value = workflow.review_state || 'pending';
      document.getElementById('expansionState').value = workflow.expansion_state || 'blocked';
      document.getElementById('workflowNotes').value = workflow.notes || '';
      document.getElementById('roleSelect').value = d.assigned_role_id || '';
      document.getElementById('trackDetails').innerHTML = `
        <div class="row"><strong>Track #${d.id}</strong><span class="pill ${statusClass(d.status)}">${d.status}</span></div>
        <div class="small">Time: ${msToClock(d.start_ms)} → ${msToClock(d.end_ms)} (${d.frame_count} frames)</div>
        <div class="small">Actor: ${d.assigned_actor_name || '—'} | Match: ${d.match_actor_name || '—'} (${(d.match_score||0).toFixed(2)})</div>
        <div class="small">Visual group: ${workflow.group_label || '—'} | Review: ${workflow.review_state || 'pending'} | Stage: ${workflow.stage || 'review'} | Expansion: ${workflow.expansion_state || 'blocked'}</div>
        <div class="small">Role / persona: ${d.assigned_role_name || '—'} (internal actor model stays separate)</div>
        <div class="small" style="margin-top:4px;">q=${(d.quality_score||0).toFixed(2)} · conf=${(d.mean_confidence||0).toFixed(2)} · ${d.detections?.length||0} detections</div>
        ${repSrc ? `<img class="thumb" src="${repSrc}" style="margin-top:8px;" />` : '<div class="small">No representative image</div>'}
        <div class="grid" style="margin-top:8px;">${thumbsHtml || ''}</div>
      `;
    }

    async function assignTrack() {
      if (!selectedTrack) return;
      const actorId = document.getElementById('actorSelect').value;
      const newActor = document.getElementById('newActorName').value.trim();
      const roleId = document.getElementById('roleSelect').value;
      const newRole = document.getElementById('newRoleName').value.trim();
      await jsonFetch(`/api/tracks/${selectedTrack.id}/assign`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          actor_id: actorId ? Number(actorId) : null,
          role_id: roleId ? Number(roleId) : null,
          new_actor_name: newActor || null,
          new_role_name: newRole || null,
          add_sample: true
        })
      });
      document.getElementById('newActorName').value = '';
      document.getElementById('newRoleName').value = '';
      document.getElementById('roleSelect').value = '';
      await loadActors();
      await loadRoles();
      await loadTracks();
      await loadOverlay();
      await selectTrack(selectedTrack.id);
    }

    async function saveWorkflow() {
      if (!selectedTrack) return;
      await jsonFetch(`/api/tracks/${selectedTrack.id}/workflow`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          group_label: document.getElementById('groupLabel').value.trim() || null,
          stage: document.getElementById('workflowStage').value,
          review_state: document.getElementById('reviewState').value,
          expansion_state: document.getElementById('expansionState').value,
          notes: document.getElementById('workflowNotes').value.trim() || null
        })
      });
      await loadTracks();
      await selectTrack(selectedTrack.id);
    }

    async function setTrackStatus(status) {
      if (!selectedTrack) return;
      await jsonFetch(`/api/tracks/${selectedTrack.id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      await loadTracks();
      await loadOverlay();
      await selectTrack(selectedTrack.id);
    }

    async function triggerRematch() {
      if (!currentVideo) {
        alert('Select a video first.');
        return;
      }
      const result = await jsonFetch('/api/rematch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ video_id: currentVideo.id })
      });
      alert(`Rematch done: updated ${result.updated}, auto-assigned ${result.assigned}, suggested ${result.suggested}`);
      await loadTracks();
      await loadOverlay();
    }

    function jumpToTrackStart() {
      if (!selectedTrack) return;
      player.currentTime = (selectedTrack.start_ms || 0) / 1000;
      player.play().catch(() => {});
    }

    player.addEventListener('loadedmetadata', () => {
      canvas.width = player.clientWidth;
      canvas.height = player.clientHeight;
    });

    drawOverlay();
    Promise.all([loadActors(), loadRoles()]).then(loadLibrary);
  </script>
</body>
</html>
