apiVersion: v1
kind: Namespace
metadata:
  name: hunyuan3d
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunyuan3d-hf-cache-pvc
  namespace: hunyuan3d
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunyuan3d
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hunyuan3d
  template:
    metadata:
      labels:
        app: hunyuan3d
    spec:
      runtimeClassName: nvidia
      containers:
      - name: hunyuan3d
        image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-devel
        workingDir: /app/Hunyuan3D-2
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            apt-get update && apt-get install -y git ffmpeg libsm6 libxext6 build-essential
            mkdir -p /app
            if [ ! -d "/app/Hunyuan3D-2/.git" ]; then
              echo "Cloning Tencent-Hunyuan/Hunyuan3D-2..."
              git clone --depth 1 https://github.com/Tencent-Hunyuan/Hunyuan3D-2.git /app/Hunyuan3D-2
            fi
            cd /app/Hunyuan3D-2
            pip install --no-cache-dir -r requirements.txt
            python3 app.py --host 0.0.0.0 --port 7860
        ports:
        - containerPort: 7860
          name: http
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 16Gi
          requests:
            nvidia.com/gpu: "1"
            memory: 8Gi
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: hf-cache
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: hunyuan3d-hf-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hunyuan3d-service
  namespace: hunyuan3d
spec:
  type: NodePort
  selector:
    app: hunyuan3d
  ports:
    - port: 7860
      targetPort: 7860
      nodePort: 30860
