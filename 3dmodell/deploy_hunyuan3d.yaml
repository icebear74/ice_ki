apiVersion: v1
kind: Namespace
metadata:
  name: hunyuan3d
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hunyuan3d-hf-cache-pvc
  namespace: hunyuan3d
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hunyuan3d
  namespace: hunyuan3d
  labels:
    app: hunyuan3d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hunyuan3d
  template:
    metadata:
      labels:
        app: hunyuan3d
    spec:
      runtimeClassName: nvidia
      containers:
      - name: hunyuan3d
        image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel
        workingDir: /workspace
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git libgl1 libegl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1
            git clone --depth 1 https://github.com/Tencent-Hunyuan/Hunyuan3D-2.1.git /workspace/Hunyuan3D-2.1
            cd /workspace/Hunyuan3D-2.1
            # Blender's archived bpy==4.0 wheel is unnecessary for shape-only STL export.
            grep -v '^bpy==4.0$' requirements.txt > /tmp/hunyuan3d-shape-requirements.txt
            pip install --no-cache-dir -r /tmp/hunyuan3d-shape-requirements.txt
            exec python3 gradio_app.py \
              --model_path tencent/Hunyuan3D-2.1 \
              --subfolder hunyuan3d-dit-v2-1 \
              --disable_tex --host 0.0.0.0 --port 7860
        ports:
        - containerPort: 7860
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 32Gi
          requests:
            nvidia.com/gpu: "1"
            memory: 16Gi
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: hf-cache
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: hunyuan3d-hf-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hunyuan3d-service
  namespace: hunyuan3d
spec:
  type: NodePort
  selector:
    app: hunyuan3d
  ports:
    - port: 7860
      targetPort: 7860
      nodePort: 30860
