<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ice_brain – Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #242736;
      --accent:     #5b6cf9;
      --accent-dim: #3d4db3;
      --text:       #e2e4f0;
      --text-muted: #8b8fa8;
      --user-bg:    #2e3a6e;
      --bot-bg:     #1e2233;
      --radius:     12px;
      --font:       'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 800px;
      padding: 14px 20px 10px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--surface2);
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--accent);
      flex: 1;
    }

    #user-id-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    #user-id-input {
      background: var(--surface2);
      border: 1px solid #333650;
      color: var(--text);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      width: 120px;
      outline: none;
    }

    #user-id-input:focus { border-color: var(--accent); }

    #model-status {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--text-muted);
    }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      width: 100%;
      max-width: 800px;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-wrap.user  { align-items: flex-end; }
    .msg-wrap.bot   { align-items: flex-start; }

    .bubble {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.93rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
    .bot  .bubble { background: var(--bot-bg);  border-bottom-left-radius: 4px; }

    .intent-badge {
      font-size: 0.7rem;
      color: var(--text-muted);
      padding: 1px 6px;
      border: 1px solid var(--surface2);
      border-radius: 20px;
      align-self: flex-start;
    }

    /* typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.1s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1.0); opacity: 1.0; }
    }

    /* ── Input bar ── */
    #input-bar {
      width: 100%;
      max-width: 800px;
      padding: 12px 16px 18px;
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--surface2);
    }

    #msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid #333650;
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.93rem;
      padding: 10px 14px;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 160px;
    }

    #msg-input:focus { border-color: var(--accent); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 0.93rem;
      padding: 0 20px;
      transition: background 0.15s;
      align-self: flex-end;
      height: 42px;
    }

    #send-btn:hover:not(:disabled) { background: var(--accent-dim); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .bubble { max-width: 88%; }
      header  { padding: 10px 12px 8px; }
      #chat   { padding: 14px 10px; }
      #input-bar { padding: 8px 10px 14px; }
    }
  </style>
</head>
<body>

<header>
  <h1>🧊 ice_brain</h1>
  <div id="user-id-wrap">
    <label for="user-id-input">User-ID:</label>
    <input id="user-id-input" type="text" value="default" autocomplete="off" spellcheck="false" />
  </div>
  <span id="model-status">Verbindet…</span>
</header>

<div id="chat" role="log" aria-live="polite" aria-label="Chatverlauf"></div>

<div id="input-bar">
  <textarea
    id="msg-input"
    rows="1"
    placeholder="Nachricht eingeben…"
    aria-label="Nachricht"
  ></textarea>
  <button id="send-btn" aria-label="Senden">Senden</button>
</div>

<script>
  /* ── Config ── */
  const API_URL = '/v1/chat/completions';
  const HEALTH_URL = '/health';

  /* ── State ── */
  const history = [];   // {role, content} objects kept for multi-turn context

  /* ── DOM refs ── */
  const chat      = document.getElementById('chat');
  const input     = document.getElementById('msg-input');
  const sendBtn   = document.getElementById('send-btn');
  const statusEl  = document.getElementById('model-status');
  const userIdEl  = document.getElementById('user-id-input');

  /* ── Status check ── */
  async function checkStatus() {
    try {
      const res = await fetch(HEALTH_URL);
      const data = await res.json();
      const models = data.models || {};
      const loaded = Object.keys(models).filter(k => models[k].loaded);
      statusEl.textContent = loaded.length
        ? '● ' + loaded.join(', ')
        : '⚠ Kein Modell geladen';
      statusEl.style.color = loaded.length ? '#6ee7b7' : '#f87171';
    } catch {
      statusEl.textContent = '⚠ Server nicht erreichbar';
      statusEl.style.color = '#f87171';
    }
  }

  checkStatus();
  setInterval(checkStatus, 15000);

  /* ── Message rendering ── */
  function appendMessage(role, text, intent) {
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${role === 'user' ? 'user' : 'bot'}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (intent && role !== 'user') {
      const badge = document.createElement('span');
      badge.className = 'intent-badge';
      badge.textContent = `intent: ${intent}`;
      wrap.appendChild(badge);
    }

    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap bot typing';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('span');
      d.className = 'dot';
      bubble.appendChild(d);
    }
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  /* ── Send ── */
  async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = '';
    sendBtn.disabled = true;

    appendMessage('user', text);
    history.push({ role: 'user', content: text });

    const typingEl = showTyping();

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'main',
          messages: history,
          temperature: 0.7,
          max_tokens: 1024,
          user: userIdEl.value.trim() || 'default',
        }),
      });

      typingEl.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        appendMessage('bot', `⚠ Fehler: ${err.error || res.statusText}`);
        history.pop();  // remove user message on error
        return;
      }

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content ?? '(keine Antwort)';
      const intent = data.router_intent ?? null;

      appendMessage('bot', reply, intent);
      history.push({ role: 'assistant', content: reply });

    } catch (e) {
      typingEl.remove();
      appendMessage('bot', `⚠ Netzwerkfehler: ${e.message}`);
      history.pop();
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  /* ── Events ── */
  sendBtn.addEventListener('click', send);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = '';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });
</script>
</body>
</html>
